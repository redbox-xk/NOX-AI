def get_github_token():
    """Get GitHub token from user"""
    print(f"\n{Colors.YELLOW}🔑 GitHub Authentication Required{Colors.END}")
    print(f"{Colors.BLUE}────────────────────────────{Colors.END}")
    print(f"Repository: {Colors.CYAN}https://github.com/{GITHUB_USER}/{REPO_NAME}{Colors.END}")
    print(f"Branch: {Colors.GREEN}{BRANCH}{Colors.END}")
    print()
    
    # Try environment variable first
    token = os.environ.get("GITHUB_TOKEN")
    if token:
        print(f"{Colors.GREEN}✅ Using GITHUB_TOKEN from environment{Colors.END}")
        return token
    
    # Ask for token
    print(f"{Colors.YELLOW}Please enter your GitHub Personal Access Token:{Colors.END}")
    print(f"{Colors.BLUE}(Create one at: https://github.com/settings/tokens){Colors.END}")
    print(f"{Colors.BLUE}Required scopes: 'repo' (full control of private repositories){Colors.END}")
    token = getpass.getpass("Token: ").strip()
    
    if not token:
        print(f"{Colors.RED}❌ No token provided. Exiting.{Colors.END}")
        sys.exit(1)
    
    return token

def test_github_token(token):
    """Test if token is valid"""
    print(f"{Colors.YELLOW}🔍 Testing GitHub token...{Colors.END}")
    
    headers = {
        "Authorization": f"token {token}",
        "Accept": "application/vnd.github.v3+json"
    }
    
    try:
        response = requests.get("https://api.github.com/user", headers=headers)
        if response.status_code == 200:
            user_data = response.json()
            print(f"{Colors.GREEN}✅ Authenticated as: {user_data['login']}{Colors.END}")
            return True
        else:
            print(f"{Colors.RED}❌ Authentication failed: {response.status_code}{Colors.END}")
            print(response.text)
            return False
    except Exception as e:
        print(f"{Colors.RED}❌ Error: {e}{Colors.END}")
        return False

def create_or_update_repo(token):
    """Create repository if it doesn't exist"""
    print(f"{Colors.YELLOW}📦 Checking repository...{Colors.END}")
    
    headers = {
        "Authorization": f"token {token}",
        "Accept": "application/vnd.github.v3+json"
    }
    
    # Check if repo exists
    response = requests.get(
        f"https://api.github.com/repos/{GITHUB_USER}/{REPO_NAME}",
        headers=headers
    )
    
    if response.status_code == 404:
        # Create repo
        print(f"{Colors.YELLOW}Repository doesn't exist. Creating...{Colors.END}")
        data = {
            "name": REPO_NAME,
            "description": "NOX Ultimate - Complete Blockchain Ecosystem with Wallet Finder and Ethereum Tools",
            "private": False,
            "auto_init": False
        }
        response = requests.post(
            "https://api.github.com/user/repos",
            headers=headers,
            json=data
        )
        if response.status_code == 201:
            print(f"{Colors.GREEN}✅ Repository created successfully{Colors.END}")
        else:
            print(f"{Colors.RED}❌ Failed to create repository: {response.status_code}{Colors.END}")
            print(response.text)
            sys.exit(1)
    elif response.status_code == 200:
        print(f"{Colors.GREEN}✅ Repository exists{Colors.END}")
    else:
        print(f"{Colors.RED}❌ Error checking repository: {response.status_code}{Colors.END}")
        sys.exit(1)

