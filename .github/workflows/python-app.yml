def create_directory_structure(base_path):
    """Create all directories"""
    dirs = [
        "src/core",
        "src/generators",
        "src/checkers",
        "src/intelligence",
        "src/utils",
        "blockchain/core",
        "blockchain/contracts",
        "ethereum/wallets",
        "ethereum/vanity",
        "wallet_finder/scanners",
        "wallet_finder/patterns",
        "output/found_wallets",
        "output/blockchain",
        "output/ethereum",
        "logs",
        "config",
        "scripts",
        "tests",
        "docs"
    ]
    
    for d in dirs:
        os.makedirs(os.path.join(base_path, d), exist_ok=True)
        print(f"  {Colors.GREEN}✅ Created: {d}{Colors.END}")

